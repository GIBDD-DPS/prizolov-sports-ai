<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="prizolov-api-base" content="" />
  <title>PRIZOLOV SPORTS AI — прогнозы</title>
  <style>
    :root {
      --bg: #0b1220;
      --card: #141e33;
      --text: #e8eefc;
      --muted: #8fa3c7;
      --accent: #3b82f6;
      --accent-2: #22c55e;
      --warn: #f59e0b;
      --ai: #a78bfa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px; }
    header { border-bottom: 1px solid #24324f; margin-bottom: 24px; padding-bottom: 16px; }
    h1 { margin: 0 0 8px; font-size: 1.5rem; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      background: #1e3a5f;
      color: var(--accent);
      font-size: 12px;
      vertical-align: middle;
    }
    .badge.ai { background: #2e2350; color: var(--ai); }
    .muted { color: var(--muted); font-size: 14px; }
    .card {
      background: var(--card);
      border: 1px solid #24324f;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .card h3 { margin: 8px 0; font-size: 1.1rem; }
    .status { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
    .status.ok { background: #132a1a; border-left: 3px solid var(--accent-2); }
    .status.warn { background: #2a2313; border-left: 3px solid var(--warn); }
    .status.err { background: #2a1313; border-left: 3px solid #ef4444; }
    footer { margin-top: 48px; color: var(--muted); font-size: 13px; }
    .disclaimer {
      background: #1a2332;
      border-left: 3px solid var(--accent-2);
      padding: 12px 16px;
      margin: 16px 0 24px;
      font-size: 14px;
      color: var(--muted);
    }
    a { color: var(--accent); }
    .kickoff { font-size: 13px; color: var(--muted); }

    /* --- сравнение прогнозов: система | Claude, рядом --- */
    .compare {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 12px;
    }
    @media (max-width: 560px) {
      .compare { grid-template-columns: 1fr; }
    }
    .pred-block {
      border-radius: 8px;
      padding: 10px 12px;
      background: #0f1830;
      border: 1px solid #24324f;
    }
    .pred-block.ai { border-color: #3a2f66; }
    .pred-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .pred-selection { font-size: 1.1rem; font-weight: 600; }
    .pred-selection .pct { color: var(--muted); font-weight: 400; font-size: 0.9rem; }
    .pred-bars { display: flex; gap: 2px; height: 6px; margin: 8px 0; border-radius: 4px; overflow: hidden; }
    .bar-1 { background: var(--accent); }
    .bar-x { background: var(--muted); }
    .bar-2 { background: var(--warn); }
    .pred-block.ai .pred-bars .bar-1 { background: var(--ai); }
    .reasoning { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
    .pred-empty { color: var(--muted); font-size: 13px; font-style: italic; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>PRIZOLOV SPORTS AI <span class="badge" id="version">…</span></h1>
      <p class="muted">Взвешенные спортивные прогнозы + AI-анализ Claude · футбол MVP</p>
    </header>

    <div id="status" class="status warn">Загрузка данных…</div>

    <div class="disclaimer">
      Прогнозы носят информационный характер и не являются рекомендацией к ставкам.
    </div>

    <h2>Ближайшие события</h2>
    <div id="events"><p class="muted">Ожидание API…</p></div>

    <footer>
      © 2026 Dm.Andreyanov — Prizolov Market / Prizolov Lab<br />
      API: <a id="health-link" href="/api/v1/health">/api/v1/health</a>
    </footer>
  </div>

  <script>
    (function () {
      const SEL = { "1": "П1", "X": "X", "2": "П2" };
      const CONF = { low: "Низкая", medium: "Средняя", high: "Высокая" };

      function apiBase() {
        const meta = document.querySelector('meta[name="prizolov-api-base"]');
        const fromMeta = meta && meta.getAttribute("content");
        if (fromMeta) return fromMeta.replace(/\/$/, "");
        const q = new URLSearchParams(location.search).get("api");
        if (q) return q.replace(/\/$/, "");
        if (location.protocol.startsWith("http")) {
          return location.origin + "/api/v1";
        }
        return "https://sport-ai-dmandreyanov.amvera.io/api/v1";
      }

      async function fetchJson(path, retries) {
        const base = apiBase();
        const url = base + path;
        let lastErr;
        for (let i = 0; i <= (retries || 2); i++) {
          try {
            const ctrl = new AbortController();
            const t = setTimeout(function () { ctrl.abort(); }, 15000);
            const res = await fetch(url, { signal: ctrl.signal, headers: { Accept: "application/json" } });
            clearTimeout(t);
            if (!res.ok) throw new Error("HTTP " + res.status);
            return await res.json();
          } catch (e) {
            lastErr = e;
            if (i < (retries || 2)) await new Promise(function (r) { setTimeout(r, 800 * (i + 1)); });
          }
        }
        throw lastErr;
      }

      function setStatus(kind, text) {
        const el = document.getElementById("status");
        el.className = "status " + kind;
        el.textContent = text;
      }

      function predBlock(pred, isAi) {
        if (!pred) {
          return (
            '<div class="pred-block' + (isAi ? " ai" : "") + '">' +
            '<div class="pred-label">' + (isAi ? "Claude AI" : "Система") + "</div>" +
            '<div class="pred-empty">' + (isAi ? "AI-прогноз ещё не сгенерирован" : "Прогноз ещё не готов") + "</div>" +
            "</div>"
          );
        }
        const home = Math.round((isAi ? pred.home_prob : pred.factors.home_prob) * 100);
        const draw = Math.round((isAi ? pred.draw_prob : pred.factors.draw_prob) * 100);
        const away = Math.round((isAi ? pred.away_prob : pred.factors.away_prob) * 100);
        const mainPct = Math.round((isAi
          ? (pred.selection === "1" ? pred.home_prob : pred.selection === "X" ? pred.draw_prob : pred.away_prob)
          : pred.probability) * 100);
        const confLabel = isAi ? pred.model : (CONF[pred.confidence] || pred.confidence);
        return (
          '<div class="pred-block' + (isAi ? " ai" : "") + '">' +
          '<div class="pred-label">' + (isAi ? "Claude AI" : "Система") +
          ' <span class="badge' + (isAi ? " ai" : "") + '">' + confLabel + "</span></div>" +
          '<div class="pred-selection">' + (SEL[pred.selection] || pred.selection) +
          ' <span class="pct">' + mainPct + "%</span></div>" +
          '<div class="pred-bars">' +
          '<div class="bar-1" style="flex:' + home + '"></div>' +
          '<div class="bar-x" style="flex:' + draw + '"></div>' +
          '<div class="bar-2" style="flex:' + away + '"></div>' +
          "</div>" +
          (isAi && pred.reasoning ? '<div class="reasoning">' + pred.reasoning + "</div>" : "") +
          "</div>"
        );
      }

      function renderEvents(items) {
        const root = document.getElementById("events");
        if (!items.length) {
          root.innerHTML = "<p class=\"muted\">Событий пока нет. Запустите парсер или подождите планировщик.</p>";
          return;
        }
        root.innerHTML = items.map(function (item) {
          const ev = item.event;
          const kick = ev.kickoff_at ? new Date(ev.kickoff_at).toLocaleString("ru-RU") : "";
          return (
            '<article class="card">' +
            '<div class="muted">' + (ev.league || "Футбол") + "</div>" +
            "<h3>" + ev.home_team + " — " + ev.away_team + "</h3>" +
            '<div class="kickoff">' + kick + "</div>" +
            '<div class="compare">' +
            predBlock(item.system_prediction, false) +
            predBlock(item.ai_prediction, true) +
            "</div>" +
            "</article>"
          );
        }).join("");
      }

      async function load() {
        const base = apiBase();
        document.getElementById("health-link").href = base + "/health";
        try {
          const health = await fetchJson("/health");
          document.getElementById("version").textContent = "v" + (health.version || "?");
          const compareData = await fetchJson("/predictions/compare?sport=football&limit=50");
          renderEvents(compareData.items || []);
          setStatus("ok", "Данные обновлены · событий: " + (compareData.count || 0) + " · API: " + base);
        } catch (e) {
          setStatus("err", "Данные временно недоступны. API: " + base + " — " + (e.message || e));
          document.getElementById("events").innerHTML =
            "<p class=\"muted\">Проверьте доступность API или откройте витрину с того же домена, что и backend (Amvera).</p>" +
            "<p class=\"muted\">Внешний хостинг: добавьте <code>?api=https://sport-ai-dmandreyanov.amvera.io/api/v1</code></p>";
        }
      }

      load();
      setInterval(load, 5 * 60 * 1000);
    })();
  </script>
</body>
</html>
