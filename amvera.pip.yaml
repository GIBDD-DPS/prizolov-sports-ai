# FALLBACK: только если в Amvera нельзя переключиться на Docker.
# Рекомендуется: meta.environment: docker + Dockerfile (см. amvera.yaml).

meta:
  environment: python
  toolchain:
    name: pip
    version: "3.11"

build:
  requirementsPath: backend/requirements.txt

run:
  command: sh -c "cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8080 --loop asyncio --workers 1"
  containerPort: 8080
  persistenceMount: /data
