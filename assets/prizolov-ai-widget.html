<!-- Elementor-ready adaptive widget for Prizolov Sports AI -->
<div id="pzsw-widget" class="pzsw-widget">
  <div class="pzsw-header">
    <div>
      <div class="pzsw-title">Prizolov AI • LIVE</div>
      <div class="pzsw-subtitle">Все улучшения модели + витрина ставок</div>
    </div>
    <button id="pzsw-refresh-btn" class="pzsw-btn" type="button">Обновить</button>
  </div>

  <div class="pzsw-badges">
    <span class="pzsw-badge">Проходимость > 60%</span>
    <span class="pzsw-badge">Коэф. >= 1.50</span>
    <span class="pzsw-badge">Сортировка: по проходимости</span>
  </div>

  <div id="pzsw-meta" class="pzsw-meta">Загрузка live событий...</div>

  <section class="pzsw-section">
    <h3 class="pzsw-section-title">Рекомендуемые ставки</h3>
    <div id="pzsw-reco-list" class="pzsw-reco-list">
      <div class="pzsw-placeholder">Анализируем события...</div>
    </div>
  </section>

  <section class="pzsw-section">
    <h3 class="pzsw-section-title">Все LIVE события</h3>
    <div id="pzsw-events-list" class="pzsw-events-list">
      <div class="pzsw-placeholder">Подгружаем матчи...</div>
    </div>
  </section>

  <div class="pzsw-footer">
    <span id="pzsw-last-update">—</span>
    <span id="pzsw-status-pill" class="pzsw-pill">online</span>
  </div>
</div>

<style>
  .pzsw-widget {
    background: linear-gradient(180deg, #151923 0%, #121624 100%);
    color: #f7f8fb;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    box-shadow: 0 12px 35px rgba(10, 14, 22, 0.35);
    padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
  }

  .pzsw-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .pzsw-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }

  .pzsw-subtitle {
    font-size: 13px;
    color: #a9b0c4;
    margin-top: 2px;
  }

  .pzsw-btn {
    border: 0;
    cursor: pointer;
    border-radius: 10px;
    background: #2563eb;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    padding: 9px 14px;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }

  .pzsw-btn:hover {
    transform: translateY(-1px);
    opacity: 0.95;
  }

  .pzsw-badges {
    margin-top: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .pzsw-badge {
    display: inline-block;
    background: rgba(37, 99, 235, 0.18);
    border: 1px solid rgba(37, 99, 235, 0.35);
    color: #cfe0ff;
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 11px;
    font-weight: 600;
  }

  .pzsw-meta {
    margin-top: 10px;
    color: #97a0b8;
    font-size: 12px;
  }

  .pzsw-section {
    margin-top: 18px;
  }

  .pzsw-section-title {
    margin: 0 0 10px;
    font-size: 16px;
    font-weight: 700;
  }

  .pzsw-placeholder {
    font-size: 13px;
    color: #9aa3bb;
    padding: 14px;
    border: 1px dashed rgba(255, 255, 255, 0.18);
    border-radius: 12px;
  }

  .pzsw-reco-list {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .pzsw-reco-card {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 12px;
    padding: 12px;
  }

  .pzsw-reco-top {
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }

  .pzsw-reco-line {
    font-size: 13px;
    font-weight: 700;
    line-height: 1.35;
    color: #f4f7ff;
  }

  .pzsw-reco-premium {
    flex-shrink: 0;
    font-size: 10px;
    font-weight: 700;
    background: rgba(253, 186, 116, 0.2);
    color: #fdba74;
    border-radius: 999px;
    padding: 4px 8px;
    height: fit-content;
  }

  .pzsw-reco-match {
    margin-top: 7px;
    font-size: 12px;
    color: #c0c8da;
  }

  .pzsw-reco-stats {
    margin-top: 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .pzsw-chip {
    font-size: 11px;
    border-radius: 8px;
    background: rgba(148, 163, 184, 0.16);
    color: #d9e0ef;
    padding: 3px 7px;
    line-height: 1.3;
  }

  .pzsw-chip.pzsw-chip-success {
    background: rgba(16, 185, 129, 0.2);
    color: #6ee7b7;
  }

  .pzsw-chip.pzsw-chip-accent {
    background: rgba(37, 99, 235, 0.2);
    color: #93c5fd;
  }

  .pzsw-events-list {
    display: grid;
    gap: 10px;
  }

  .pzsw-event-card {
    background: rgba(255, 255, 255, 0.035);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    padding: 12px;
  }

  .pzsw-event-head {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: flex-start;
  }

  .pzsw-event-title {
    font-size: 14px;
    font-weight: 700;
    line-height: 1.35;
  }

  .pzsw-event-league {
    font-size: 11px;
    color: #9ea7c0;
    margin-top: 3px;
  }

  .pzsw-event-prob {
    font-size: 13px;
    font-weight: 700;
    color: #6ee7b7;
    white-space: nowrap;
  }

  .pzsw-event-recs {
    margin-top: 8px;
    display: grid;
    gap: 6px;
  }

  .pzsw-event-rec {
    font-size: 12px;
    color: #dbe2f3;
    background: rgba(255, 255, 255, 0.04);
    border-radius: 9px;
    padding: 7px 8px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }

  .pzsw-footer {
    margin-top: 14px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: center;
    font-size: 11px;
    color: #9ea7c0;
  }

  .pzsw-pill {
    border-radius: 999px;
    padding: 3px 8px;
    background: rgba(16, 185, 129, 0.18);
    color: #86efac;
    border: 1px solid rgba(16, 185, 129, 0.32);
    font-weight: 700;
  }

  .pzsw-pill.error {
    background: rgba(239, 68, 68, 0.2);
    color: #fca5a5;
    border-color: rgba(239, 68, 68, 0.4);
  }

  @media (max-width: 1024px) {
    .pzsw-reco-list {
      grid-template-columns: 1fr;
    }
  }

  @media (max-width: 640px) {
    .pzsw-widget {
      border-radius: 12px;
      padding: 12px;
    }
    .pzsw-title {
      font-size: 18px;
    }
    .pzsw-subtitle {
      font-size: 12px;
    }
    .pzsw-btn {
      font-size: 12px;
      padding: 8px 10px;
    }
    .pzsw-section-title {
      font-size: 15px;
    }
  }
</style>

<script>
  (function() {
    var root = document.getElementById("pzsw-widget");
    if (!root) return;

    var CONFIG = {
      apiBase: window.PRIZOLOV_API_BASE || "",
      lang: window.PRIZOLOV_WIDGET_LANG || "ru",
      minProbability: 0.6,
      minCoefficient: 1.5,
      topLimit: 16,
      eventsLimit: 40,
      refreshMs: 45000
    };

    var refreshBtn = document.getElementById("pzsw-refresh-btn");
    var recoList = document.getElementById("pzsw-reco-list");
    var eventsList = document.getElementById("pzsw-events-list");
    var meta = document.getElementById("pzsw-meta");
    var lastUpdate = document.getElementById("pzsw-last-update");
    var statusPill = document.getElementById("pzsw-status-pill");

    function esc(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function num(value, fallback) {
      var parsed = parseFloat(value);
      return Number.isFinite(parsed) ? parsed : fallback;
    }

    function pct(probability) {
      return Math.round(num(probability, 0) * 100);
    }

    function formatCoef(value) {
      return num(value, 0).toFixed(2);
    }

    function qualify(rec) {
      return num(rec && rec.probability, 0) > CONFIG.minProbability && num(rec && rec.coefficient, 0) >= CONFIG.minCoefficient;
    }

    function withTimeout(url, ms) {
      var controller = new AbortController();
      var timer = setTimeout(function() {
        controller.abort();
      }, ms);
      return fetch(url, { signal: controller.signal }).finally(function() {
        clearTimeout(timer);
      });
    }

    function buildUrl(path, params) {
      var query = new URLSearchParams(params || {});
      return CONFIG.apiBase + path + "?" + query.toString();
    }

    async function fetchJson(path, params) {
      var url = buildUrl(path, params);
      var response = await withTimeout(url, 12000);
      if (!response.ok) throw new Error("HTTP " + response.status + " for " + path);
      return response.json();
    }

    function flattenRecommendations(events) {
      var output = [];
      (events || []).forEach(function(event) {
        (event.recommendations || []).forEach(function(rec) {
          output.push({
            event_id: event.id,
            league: event.league,
            home: event.home,
            away: event.away,
            sport: event.sport,
            line: rec.line,
            probability: rec.probability,
            coefficient: rec.coefficient,
            edge: rec.edge,
            bookmakers_support: rec.bookmakers_support,
            weighted_bookmakers_support: rec.weighted_bookmakers_support,
            no_vig_probability: rec.no_vig_probability,
            market_overround: rec.market_overround,
            selection_tier: rec.selection_tier,
            is_premium: rec.is_premium
          });
        });
      });
      return output;
    }

    function sortRecommendations(items) {
      return items.sort(function(a, b) {
        var pDiff = num(b.probability, 0) - num(a.probability, 0);
        if (Math.abs(pDiff) > 0.0001) return pDiff;
        var cDiff = num(b.coefficient, 0) - num(a.coefficient, 0);
        if (Math.abs(cDiff) > 0.0001) return cDiff;
        return num(b.edge, -999) - num(a.edge, -999);
      });
    }

    function renderRecommendations(recommendations) {
      if (!recommendations.length) {
        recoList.innerHTML = '<div class="pzsw-placeholder">Под условия (>60% и коэф. >=1.5) подходящих ставок пока нет.</div>';
        return;
      }

      recoList.innerHTML = recommendations.slice(0, CONFIG.topLimit).map(function(rec) {
        var prob = pct(rec.probability);
        var coef = formatCoef(rec.coefficient);
        var edge = (num(rec.edge, 0) * 100).toFixed(1);
        var weightedSupport = num(rec.weighted_bookmakers_support, rec.bookmakers_support || 0).toFixed(1);
        var noVig = rec.no_vig_probability == null ? "—" : (pct(rec.no_vig_probability) + "%");
        var overround = rec.market_overround == null ? "—" : (num(rec.market_overround, 0) * 100).toFixed(2) + "%";

        return '<article class="pzsw-reco-card">' +
          '<div class="pzsw-reco-top">' +
            '<div class="pzsw-reco-line">' + esc(rec.line) + '</div>' +
            (rec.is_premium ? '<span class="pzsw-reco-premium">PREMIUM</span>' : '') +
          '</div>' +
          '<div class="pzsw-reco-match">' + esc(rec.home) + ' vs ' + esc(rec.away) + '</div>' +
          '<div class="pzsw-reco-stats">' +
            '<span class="pzsw-chip pzsw-chip-success">Вероятность: ' + prob + '%</span>' +
            '<span class="pzsw-chip pzsw-chip-accent">Коэф: ' + coef + '</span>' +
            '<span class="pzsw-chip">Edge: ' + edge + '%</span>' +
            '<span class="pzsw-chip">Поддержка БК: ' + weightedSupport + '</span>' +
            '<span class="pzsw-chip">No-vig: ' + noVig + '</span>' +
            '<span class="pzsw-chip">Overround: ' + overround + '</span>' +
          '</div>' +
        '</article>';
      }).join("");
    }

    function renderEvents(events) {
      if (!events.length) {
        eventsList.innerHTML = '<div class="pzsw-placeholder">LIVE события не найдены.</div>';
        return;
      }

      eventsList.innerHTML = events.map(function(event) {
        var topProbability = pct(event.top_probability || 0);
        var recommendationsHtml = (event.recommendations || []).slice(0, 3).map(function(rec) {
          return '<div class="pzsw-event-rec">' +
              '<span>' + esc(rec.line) + '</span>' +
              '<strong>' + pct(rec.probability) + '% • ' + formatCoef(rec.coefficient) + '</strong>' +
            '</div>';
        }).join("");

        return '<article class="pzsw-event-card">' +
          '<div class="pzsw-event-head">' +
            '<div>' +
              '<div class="pzsw-event-title">' + esc(event.home) + ' vs ' + esc(event.away) + '</div>' +
              '<div class="pzsw-event-league">' + esc(event.league || "—") + ' • ' + esc(event.time || "—") + '</div>' +
            '</div>' +
            '<div class="pzsw-event-prob">' + topProbability + '%</div>' +
          '</div>' +
          '<div class="pzsw-event-recs">' + recommendationsHtml + '</div>' +
        '</article>';
      }).join("");
    }

    function setStatus(ok, text) {
      statusPill.classList.toggle("error", !ok);
      statusPill.textContent = ok ? "online" : "error";
      meta.textContent = text;
      lastUpdate.textContent = "Обновлено: " + new Date().toLocaleTimeString();
    }

    async function loadWidget() {
      refreshBtn.disabled = true;
      setStatus(true, "Обновляем данные...");

      try {
        var eventsPromise = fetchJson("/api/all-events", {
          lang: CONFIG.lang,
          min_probability: CONFIG.minProbability,
          recommendations_only: true,
          sort_by: "probability",
          include_top: true,
          top_limit: CONFIG.topLimit,
          limit: CONFIG.eventsLimit,
          premium_only: false
        });

        var topPromise = fetchJson("/api/recommendations/top", {
          lang: CONFIG.lang,
          limit: CONFIG.topLimit * 2,
          min_probability: CONFIG.minProbability,
          premium_only: false
        });

        var settled = await Promise.allSettled([eventsPromise, topPromise]);
        var eventsPayload = settled[0].status === "fulfilled" ? settled[0].value : { events: [] };
        var topPayload = settled[1].status === "fulfilled" ? settled[1].value : { recommendations: [] };

        var eventsRaw = Array.isArray(eventsPayload.events) ? eventsPayload.events : [];

        var eventsPrepared = eventsRaw.map(function(event) {
          var recs = Array.isArray(event.recommendations) ? event.recommendations.filter(qualify) : [];
          recs = sortRecommendations(recs);
          var topProbability = recs.length ? num(recs[0].probability, 0) : 0;
          return {
            id: event.id,
            league: event.league,
            home: event.home,
            away: event.away,
            time: event.time,
            recommendations: recs,
            top_probability: topProbability
          };
        }).filter(function(event) {
          return event.recommendations.length > 0;
        }).sort(function(a, b) {
          return num(b.top_probability, 0) - num(a.top_probability, 0);
        });

        var recommendationsRaw = Array.isArray(topPayload.recommendations) ? topPayload.recommendations : flattenRecommendations(eventsPrepared);
        var recommended = sortRecommendations(recommendationsRaw.filter(qualify));

        renderRecommendations(recommended);
        renderEvents(eventsPrepared);

        var totalEvents = eventsPrepared.length;
        var totalRecommendations = recommended.length;
        setStatus(true, "LIVE: " + totalEvents + " • Рекомендаций: " + totalRecommendations + " • Фильтр: >60% и >=1.5");
      } catch (error) {
        console.error("[Prizolov Elementor Widget] load error", error);
        recoList.innerHTML = '<div class="pzsw-placeholder">Ошибка загрузки рекомендаций.</div>';
        eventsList.innerHTML = '<div class="pzsw-placeholder">Ошибка загрузки live событий.</div>';
        setStatus(false, "Ошибка API: " + (error && error.message ? error.message : "unknown"));
      } finally {
        refreshBtn.disabled = false;
      }
    }

    refreshBtn.addEventListener("click", function() {
      loadWidget();
    });

    loadWidget();
    setInterval(loadWidget, CONFIG.refreshMs);
  })();
</script>
