<!-- Контейнер для вывода виджета ИИ -->
<div id="prizolov-ai-widget" style="background: #1e1e24; color: #fff; padding: 20px; border-radius: 12px; font-family: sans-serif; max-width: 450px; margin: 15px auto;">
    <!-- Шапка LIVE-матча -->
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 15px;">
        <div>
            <span id="c-league" style="font-size: 12px; text-transform: uppercase; color: #888; letter-spacing: 1px;">Загрузка лиги...</span>
            <div id="c-match" style="font-size: 18px; font-weight: bold; margin-top: 5px;">Поиск события...</div>
            <div id="c-sport" style="font-size: 11px; color: #666; margin-top: 3px;">—</div>
        </div>
        <span id="c-time" style="background: #ff3b30; color: #fff; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; animation: blink 1.5s infinite;">LIVE</span>
    </div>
    <!-- Список рекомендаций -->
    <div id="recs"><div class="ph" style="color: #888; text-align: center; padding: 20px;">🤖 AI анализирует рынок...</div></div>
    <!-- Навигация по матчам -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding-top: 10px; border-top: 1px solid #333;">
        <button id="prev-match" style="background: #007aff; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;">← Предыдущий</button>
        <span id="match-counter" style="font-size: 11px; color: #666;">Матч 1 из ?</span>
        <button id="next-match" style="background: #007aff; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;">Следующий →</button>
    </div>
</div>

<style>
@keyframes blink { 0% {opacity: 1;} 50% {opacity: 0.4;} 100% {opacity: 1;} }
.rec { display: flex; justify-content: space-between; align-items: center; background: #2a2a32; padding: 12px; border-radius: 8px; margin-bottom: 8px; border-left: 4px solid #007aff; }
.rec-league { font-size: 11px; color: #aaa; text-transform: uppercase; }
.rec-marker { font-size: 14px; margin: 4px 0; font-weight: 500; }
.rec-meta { font-size: 12px; color: #888; }
.conf { padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; margin-left: 5px; }
.conf.high { background: rgba(52, 199, 89, 0.2); color: #34c759; }
.conf.med { background: rgba(255, 149, 0, 0.2); color: #ff9500; }
.rec-coef { background: #007aff; color: #fff; padding: 6px 12px; border-radius: 6px; font-weight: bold; font-size: 15px; min-width: 45px; text-align: center; }
button:hover { opacity: 0.8; }
</style>

<script>
document.addEventListener("DOMContentLoaded", function() {
    var TARGET_URL = "/get-ai-sports.php";
    var currentEventIndex = 0;
    var allEvents = [];

    function escapeHtml(str) {
        if (!str) return "";
        return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
    }

    function formatSport(sport) {
        if (!sport) return "FOOTBALL";
        return String(sport).toUpperCase();
    }

    function normalizeProbability(value) {
        var parsed = parseFloat(value);
        if (!isFinite(parsed)) return 0;
        if (parsed > 1) parsed = parsed / 100;
        if (parsed < 0) parsed = 0;
        if (parsed > 1) parsed = 1;
        return parsed;
    }

    function normalizeCoefficient(value) {
        var parsed = parseFloat(value);
        if (!isFinite(parsed) || parsed <= 0) return 1.5;
        return parsed;
    }

    function normalizeEvent(raw) {
        if (!raw || typeof raw !== "object") return null;

        var matchInfo = raw.match_info || {};
        var recommendations = Array.isArray(raw.recommendations) ? raw.recommendations : [];
        var baseSport = raw.sport || matchInfo.sport || "football";
        var baseLeague = raw.league || matchInfo.league || "—";
        var baseHome = raw.home || raw.home_team || matchInfo.home || "—";
        var baseAway = raw.away || raw.away_team || matchInfo.away || "—";

        var normalizedRecs = recommendations.map(function(rec) {
            return {
                line: rec.line || rec.market || "Исход",
                confidence: rec.confidence === "high" ? "high" : "med",
                probability: normalizeProbability(rec.probability),
                coefficient: normalizeCoefficient(rec.coefficient || rec.price || rec.odds),
                league: rec.league || baseLeague,
                sport: rec.sport || baseSport,
                home: rec.home || baseHome,
                away: rec.away || baseAway
            };
        });

        return {
            league: baseLeague,
            home: baseHome,
            away: baseAway,
            sport: baseSport,
            status: raw.status || matchInfo.status || raw.time || "LIVE",
            recommendations: normalizedRecs
        };
    }

    function extractEvents(payload) {
        var source = [];

        if (payload && Array.isArray(payload.events)) {
            source = payload.events;
        } else if (Array.isArray(payload)) {
            source = payload;
        } else if (payload && (payload.match_info || Array.isArray(payload.recommendations))) {
            source = [payload];
        }

        return source.map(normalizeEvent).filter(function(event) {
            return !!event;
        });
    }

    function updateCounter() {
        var counter = document.getElementById("match-counter");
        if (!counter) return;
        if (allEvents.length === 0) {
            counter.innerText = "Матчи не найдены";
            return;
        }
        counter.innerText = "Матч " + (currentEventIndex + 1) + " из " + allEvents.length;
    }

    async function fetchSingleEvent(index) {
        try {
            var resp = await fetch(TARGET_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                body: JSON.stringify({
                    version_bypass: Date.now(),
                    event_index: index
                })
            });
            if (!resp.ok) throw new Error("HTTP " + resp.status);
            return await resp.json();
        } catch (e) {
            console.error("[Prizolov AI] ❌ Ошибка загрузки события:", e);
            return null;
        }
    }

    async function fetchAllEvents() {
        try {
            console.log("[Prizolov AI] 📥 Загружаю полный список матчей...");
            var resp = await fetch(TARGET_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                body: JSON.stringify({
                    version_bypass: Date.now(),
                    get_all: true
                })
            });

            if (!resp.ok) throw new Error("HTTP " + resp.status);
            var data = await resp.json();
            var events = extractEvents(data);
            console.log("[Prizolov AI] ✅ Загружено live событий:", events.length);
            return events;
        } catch (e) {
            console.error("[Prizolov AI] ❌ Ошибка загрузки списка:", e);
            return [];
        }
    }

    async function displayEvent(index) {
        try {
            // Если список ещё пуст, пробуем получить хотя бы одно событие.
            if (allEvents.length === 0) {
                var singlePayload = await fetchSingleEvent(index);
                var fallbackEvents = extractEvents(singlePayload);
                if (fallbackEvents.length > 0) {
                    allEvents = fallbackEvents;
                } else {
                    var recsDivEmpty = document.getElementById("recs");
                    if (recsDivEmpty) {
                        recsDivEmpty.innerHTML = '<div class="ph" style="color: #888; text-align: center; padding: 20px;">🤖 Live события пока не найдены</div>';
                    }
                    updateCounter();
                    return;
                }
            }

            currentEventIndex = (index % allEvents.length + allEvents.length) % allEvents.length;
            var event = allEvents[currentEventIndex];
            console.log("[Prizolov AI] 🔄 Показываю событие #" + (currentEventIndex + 1), event);

            // Заполнение заголовка
            var leagueEl = document.getElementById("c-league");
            if (leagueEl) leagueEl.innerText = event.league || "—";

            var matchEl = document.getElementById("c-match");
            if (matchEl) {
                matchEl.innerText = (event.home || "?") + " vs " + (event.away || "?");
            }

            var sportEl = document.getElementById("c-sport");
            if (sportEl) {
                sportEl.innerText = formatSport(event.sport);
            }

            var timeEl = document.getElementById("c-time");
            if (timeEl) timeEl.innerText = event.status || "LIVE";

            // Отображение рекомендаций
            var recs = Array.isArray(event.recommendations) ? event.recommendations : [];
            var recsDiv = document.getElementById("recs");

            if (recsDiv) {
                if (recs.length > 0) {
                    var htmlResult = "";

                    for (var i = 0; i < Math.min(recs.length, 8); i++) {
                        var r = recs[i];
                        var probPercent = Math.round(normalizeProbability(r.probability) * 100);
                        var confClass = r.confidence === "high" ? "high" : "med";
                        var confText = r.confidence === "high" ? "Выбор" : "Ср";
                        var coefFormatted = normalizeCoefficient(r.coefficient).toFixed(2);

                        htmlResult += '<div class="rec">' +
                                        '<div class="rec-info">' +
                                            '<div class="rec-league">' + escapeHtml(r.league || event.league || "РПЛ") + ' • ' + formatSport(r.sport || event.sport) + '</div>' +
                                            '<div class="rec-marker">' + escapeHtml(r.home || event.home || "Команда") + ' vs ' + escapeHtml(r.away || event.away || "Команда") + ' ➔ <span style="color:#007aff; font-weight:bold;">' + escapeHtml(r.line || "Исход") + '</span></div>' +
                                            '<div class="rec-meta">Вер: ' + probPercent + '% <span class="conf ' + confClass + '">' + confText + '</span></div>' +
                                        '</div>' +
                                        '<span class="rec-coef">' + coefFormatted + '</span>' +
                                      '</div>';
                    }

                    recsDiv.innerHTML = htmlResult;
                    console.log("[Prizolov AI] ✅ Рекомендации отрисованы: " + recs.length);
                } else {
                    recsDiv.innerHTML = '<div class="ph" style="color: #888; text-align: center; padding: 20px;">🤖 Нет рекомендаций для этого матча</div>';
                    console.log("[Prizolov AI] ⚠️ Нет рекомендаций");
                }
            }

            updateCounter();
        } catch (e) {
            console.error("[Prizolov AI] ❌ Ошибка отображения:", e);
        }
    }

    // Кнопки навигации
    document.getElementById("next-match").addEventListener("click", function() {
        if (allEvents.length > 0) {
            currentEventIndex = (currentEventIndex + 1) % allEvents.length;
            displayEvent(currentEventIndex);
        }
    });

    document.getElementById("prev-match").addEventListener("click", function() {
        if (allEvents.length > 0) {
            currentEventIndex = (currentEventIndex - 1 + allEvents.length) % allEvents.length;
            displayEvent(currentEventIndex);
        }
    });

    // Инициализация
    async function init() {
        console.log("[Prizolov AI] 🚀 Инициализация виджета...");

        allEvents = await fetchAllEvents();

        // Загружаем первое событие сразу (или fallback на single-event).
        await displayEvent(0);

        // Каждые 10 секунд показываем следующий матч автоматически
        setInterval(function() {
            if (allEvents.length > 0) {
                currentEventIndex = (currentEventIndex + 1) % allEvents.length;
                displayEvent(currentEventIndex);
            }
        }, 10000);
    }

    init();
});
</script>
