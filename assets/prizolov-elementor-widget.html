<div id="prizolov-sport-widget" class="pz-container">
  <div class="pz-header">
    <h1>🎯 PRIZOLOV SPORTS AI</h1>
    <p>Live аналитика матчей всех видов спорта с AI прогнозами</p>
  </div>

  <div class="pz-widgets-grid">
    <div class="pz-widget" id="main-widget">
      <div class="pz-widget-header">
        <div>
          <div class="pz-widget-league" id="main-league">Загрузка...</div>
          <div class="pz-widget-match" id="main-match">Загрузка матча...</div>
          <div class="pz-widget-sport" id="main-sport">—</div>
        </div>
        <span class="pz-widget-time" id="main-time">LIVE</span>
      </div>

      <div class="pz-recommendations" id="main-recs">
        <div class="pz-loading">🤖 Анализирую матчи...</div>
      </div>

      <div class="pz-widget-controls">
        <button class="pz-btn" id="prev-btn" type="button">← Предыдущий</button>
        <span class="pz-counter" id="counter">Загрузка...</span>
        <button class="pz-btn" id="next-btn" type="button">Следующий →</button>
      </div>
    </div>

    <div class="pz-stats" id="stats-panel">
      <h2>📊 Статистика</h2>
      <div class="pz-stats-grid">
        <div class="pz-stat-item">
          <div class="pz-stat-value" id="total-events">0</div>
          <div class="pz-stat-label">Live матчей</div>
        </div>
        <div class="pz-stat-item">
          <div class="pz-stat-value" id="total-recs">0</div>
          <div class="pz-stat-label">Рекомендаций</div>
        </div>
        <div class="pz-stat-item">
          <div class="pz-stat-value" id="total-sports">0</div>
          <div class="pz-stat-label">Видов спорта</div>
        </div>
        <div class="pz-stat-item">
          <div class="pz-stat-value" id="avg-coef">0</div>
          <div class="pz-stat-label">Средний коэф</div>
        </div>
      </div>
      <div class="pz-last-update" id="last-update">Последнее обновление: —</div>
    </div>
  </div>

  <div class="pz-widget" id="all-events-section" style="margin-top:30px;">
    <h2 style="margin-bottom:20px;">📋 Все Live события (сортировка по проходимости)</h2>
    <div id="all-events-list"></div>
  </div>
</div>

<script>
(function () {
  if (window.__PRIZOLOV_WIDGET_INIT__) return;
  window.__PRIZOLOV_WIDGET_INIT__ = true;

  var API_BASE = window.PRIZOLOV_API_BASE || "";
  var API_ALL_EVENTS = "/api/all-events";
  var API_WIDGET = "/get-ai-sports.php";

  var MIN_PASSABILITY = 0.60;
  var MIN_COEFFICIENT = 1.50;
  var AUTO_ROTATE_MS = 10000;
  var AUTO_REFRESH_MS = 45000;

  function asNum(value, fallback) {
    var parsed = Number(value);
    return Number.isFinite(parsed) ? parsed : fallback;
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return "—";
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function asSport(s) {
    return (s || "football").toString().toUpperCase();
  }

  function formatCoef(value) {
    return asNum(value, 1.5).toFixed(2);
  }

  function formatProbability(value) {
    return Math.round(asNum(value, 0) * 100);
  }

  function buildUrl(path, params) {
    var query = new URLSearchParams(params || {});
    return API_BASE + path + "?" + query.toString();
  }

  async function fetchJson(url, options) {
    var response = await fetch(url, options || {});
    if (!response.ok) throw new Error("HTTP " + response.status);
    var contentType = response.headers.get("content-type") || "";
    if (!contentType.includes("application/json")) {
      throw new Error("Expected JSON, got: " + contentType);
    }
    return response.json();
  }

  function normalizeRecommendation(rec, event) {
    if (!rec || typeof rec !== "object") return null;
    return {
      line: rec.line || "Исход",
      confidence: rec.confidence === "high" ? "high" : "med",
      probability: Math.max(0, Math.min(1, asNum(rec.probability, 0))),
      coefficient: asNum(rec.coefficient, 1.5),
      league: rec.league || event.league || "—",
      sport: rec.sport || event.sport || "football",
      home: rec.home || event.home || "—",
      away: rec.away || event.away || "—",
      edge: asNum(rec.edge, 0),
      is_premium: Boolean(rec.is_premium)
    };
  }

  function normalizeEvent(event) {
    if (!event || typeof event !== "object") return null;

    var recs = Array.isArray(event.recommendations) ? event.recommendations : [];
    var normalizedRecs = recs
      .map(function (rec) { return normalizeRecommendation(rec, event); })
      .filter(Boolean);

    var filteredRecs = normalizedRecs
      .filter(function (rec) {
        return rec.probability > MIN_PASSABILITY && rec.coefficient >= MIN_COEFFICIENT;
      })
      .sort(function (a, b) {
        var pDiff = b.probability - a.probability;
        if (Math.abs(pDiff) > 0.0001) return pDiff;
        var cDiff = b.coefficient - a.coefficient;
        if (Math.abs(cDiff) > 0.0001) return cDiff;
        return b.edge - a.edge;
      });

    return {
      id: event.id || (event.home + "_" + event.away),
      league: event.league || "—",
      home: event.home || event.home_team || "—",
      away: event.away || event.away_team || "—",
      sport: event.sport || event.sport_code || "football",
      status: event.status || event.time || "LIVE",
      time: event.time || event.status || "LIVE",
      recommendations: filteredRecs,
      allRecommendations: normalizedRecs,
      topProbability: filteredRecs.length ? filteredRecs[0].probability : 0
    };
  }

  function fromSingleResponse(data) {
    if (!data || typeof data !== "object" || !data.match_info) return [];
    return [{
      league: data.match_info.league || "—",
      home: data.match_info.home || "—",
      away: data.match_info.away || "—",
      sport: data.match_info.sport || "football",
      status: data.match_info.status || "LIVE",
      time: data.match_info.status || "LIVE",
      recommendations: Array.isArray(data.recommendations) ? data.recommendations : []
    }];
  }

  function PrizolovWidget(rootEl) {
    this.root = rootEl;
    this.currentIndex = 0;
    this.events = [];
    this.rotateTimer = null;
    this.refreshTimer = null;

    this.mainLeague = this.root.querySelector("#main-league");
    this.mainMatch = this.root.querySelector("#main-match");
    this.mainSport = this.root.querySelector("#main-sport");
    this.mainTime = this.root.querySelector("#main-time");
    this.mainRecs = this.root.querySelector("#main-recs");
    this.counter = this.root.querySelector("#counter");
    this.allEventsList = this.root.querySelector("#all-events-list");
    this.totalEvents = this.root.querySelector("#total-events");
    this.totalRecs = this.root.querySelector("#total-recs");
    this.totalSports = this.root.querySelector("#total-sports");
    this.avgCoef = this.root.querySelector("#avg-coef");
    this.lastUpdate = this.root.querySelector("#last-update");
    this.prevBtn = this.root.querySelector("#prev-btn");
    this.nextBtn = this.root.querySelector("#next-btn");
  }

  PrizolovWidget.prototype.init = async function () {
    this.attachListeners();
    await this.reload();
    this.startTimers();
  };

  PrizolovWidget.prototype.attachListeners = function () {
    var self = this;
    if (this.nextBtn) {
      this.nextBtn.addEventListener("click", function () {
        self.displayEvent(self.currentIndex + 1);
      });
    }
    if (this.prevBtn) {
      this.prevBtn.addEventListener("click", function () {
        self.displayEvent(self.currentIndex - 1);
      });
    }
  };

  PrizolovWidget.prototype.startTimers = function () {
    var self = this;
    this.rotateTimer = setInterval(function () {
      if (self.events.length > 1) self.displayEvent(self.currentIndex + 1);
    }, AUTO_ROTATE_MS);

    this.refreshTimer = setInterval(function () {
      self.reload();
    }, AUTO_REFRESH_MS);
  };

  PrizolovWidget.prototype.stopTimers = function () {
    if (this.rotateTimer) clearInterval(this.rotateTimer);
    if (this.refreshTimer) clearInterval(this.refreshTimer);
  };

  PrizolovWidget.prototype.setError = function (message) {
    if (this.mainRecs) this.mainRecs.innerHTML = "<div class='pz-loading'>" + escapeHtml(message) + "</div>";
    if (this.counter) this.counter.textContent = "Ошибка API";
    if (this.allEventsList) this.allEventsList.innerHTML = "<div class='pz-loading'>" + escapeHtml(message) + "</div>";
  };

  PrizolovWidget.prototype.fetchAllEvents = async function () {
    var allEventsUrl = buildUrl(API_ALL_EVENTS, {
      lang: "ru",
      limit: "80",
      sort_by: "probability",
      min_probability: "0",
      recommendations_only: "false",
      include_top: "true",
      top_limit: "30",
      premium_only: "false",
      policy_mode: "auto",
      adaptive_policy: "true"
    });

    try {
      var payload = await fetchJson(allEventsUrl);
      if (payload && Array.isArray(payload.events) && payload.events.length > 0) {
        return payload.events;
      }
    } catch (err) {
      console.warn("[Prizolov AI] /api/all-events fallback to widget endpoint", err);
    }

    var data = await fetchJson(API_BASE + API_WIDGET, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ get_all: true, _ts: Date.now() })
    });

    if (data && Array.isArray(data.events) && data.events.length > 0) {
      return data.events;
    }
    return fromSingleResponse(data);
  };

  PrizolovWidget.prototype.reload = async function () {
    if (this.nextBtn) this.nextBtn.disabled = true;
    if (this.prevBtn) this.prevBtn.disabled = true;

    try {
      var rawEvents = await this.fetchAllEvents();
      this.events = rawEvents
        .map(normalizeEvent)
        .filter(Boolean)
        .sort(function (a, b) {
          return b.topProbability - a.topProbability;
        });

      this.updateStats();
      this.renderAllEvents();
      this.displayEvent(this.currentIndex);

      if (this.lastUpdate) {
        this.lastUpdate.textContent = "Последнее обновление: " + new Date().toLocaleTimeString();
      }
    } catch (err) {
      console.error("[Prizolov AI] reload error:", err);
      this.events = [];
      this.updateStats();
      this.setError("Ошибка загрузки данных");
    } finally {
      if (this.nextBtn) this.nextBtn.disabled = false;
      if (this.prevBtn) this.prevBtn.disabled = false;
    }
  };

  PrizolovWidget.prototype.displayEvent = function (index) {
    if (!Array.isArray(this.events) || this.events.length === 0) {
      if (this.counter) this.counter.textContent = "Нет событий";
      return;
    }

    this.currentIndex = ((index % this.events.length) + this.events.length) % this.events.length;
    var event = this.events[this.currentIndex];

    if (this.mainLeague) this.mainLeague.textContent = event.league;
    if (this.mainMatch) this.mainMatch.textContent = event.home + " vs " + event.away;
    if (this.mainSport) this.mainSport.textContent = asSport(event.sport);
    if (this.mainTime) this.mainTime.textContent = event.status || "LIVE";
    if (this.counter) this.counter.textContent = "Матч " + (this.currentIndex + 1) + " из " + this.events.length;

    if (!this.mainRecs) return;

    var recommendations = Array.isArray(event.recommendations) ? event.recommendations : [];
    if (recommendations.length === 0) {
      this.mainRecs.innerHTML = "<div class='pz-loading'>Нет рекомендаций c проходимостью > 60% и коэф. >= 1.5</div>";
      return;
    }

    var html = "";
    recommendations.slice(0, 8).forEach(function (rec) {
      var confClass = rec.confidence === "high" ? "high" : "med";
      var confText = rec.confidence === "high" ? "Высокая" : "Средняя";

      html += "<div class='pz-rec-item'>" +
        "<div class='pz-rec-info'>" +
          "<div class='pz-rec-league'>" + escapeHtml(rec.league || event.league) + " • " + asSport(rec.sport || event.sport) + "</div>" +
          "<div class='pz-rec-line'><span class='pz-rec-line-name'>" + escapeHtml(rec.line) + "</span></div>" +
          "<div class='pz-rec-meta'>" +
            "Вер: <strong>" + formatProbability(rec.probability) + "%</strong>" +
            "<span class='pz-confidence " + confClass + "'>" + confText + "</span>" +
            "<span class='pz-rec-chip'>Edge: " + (asNum(rec.edge, 0) * 100).toFixed(1) + "%</span>" +
          "</div>" +
        "</div>" +
        "<div class='pz-rec-coef'>" + formatCoef(rec.coefficient) + "</div>" +
      "</div>";
    });

    this.mainRecs.innerHTML = html;
  };

  PrizolovWidget.prototype.updateStats = function () {
    var eventsCount = this.events.length;
    var recCount = 0;
    var coefSum = 0;
    var sports = {};

    this.events.forEach(function (event) {
      sports[event.sport] = true;
      (event.recommendations || []).forEach(function (rec) {
        recCount += 1;
        coefSum += asNum(rec.coefficient, 1.5);
      });
    });

    if (this.totalEvents) this.totalEvents.textContent = String(eventsCount);
    if (this.totalRecs) this.totalRecs.textContent = String(recCount);
    if (this.totalSports) this.totalSports.textContent = String(Object.keys(sports).length);
    if (this.avgCoef) this.avgCoef.textContent = recCount > 0 ? (coefSum / recCount).toFixed(2) : "0";
  };

  PrizolovWidget.prototype.renderAllEvents = function () {
    if (!this.allEventsList) return;
    if (!this.events.length) {
      this.allEventsList.innerHTML = "<div class='pz-loading'>Нет live событий</div>";
      return;
    }

    var tableHtml = "<div class='pz-events-table-wrap'><table class='pz-events-table'><thead><tr>" +
      "<th>Время</th><th>Вид спорта</th><th>Матч</th><th>Лига</th><th>Проходимость</th><th>Лучшая ставка</th><th>Реков</th>" +
      "</tr></thead><tbody>";

    this.events.forEach(function (event, idx) {
      var bestRec = (event.recommendations && event.recommendations[0]) || null;
      var bestProbability = bestRec ? formatProbability(bestRec.probability) : 0;
      var bestLine = bestRec ? bestRec.line + " @ " + formatCoef(bestRec.coefficient) : "Нет подходящих";
      var bgColor = idx % 2 === 0 ? "#1e1e24" : "#25252c";

      tableHtml += "<tr style='background:" + bgColor + ";'>" +
        "<td>" + escapeHtml(event.time || "LIVE") + "</td>" +
        "<td><span class='pz-sport-badge'>" + asSport(event.sport) + "</span></td>" +
        "<td><strong>" + escapeHtml(event.home) + " vs " + escapeHtml(event.away) + "</strong></td>" +
        "<td>" + escapeHtml(event.league) + "</td>" +
        "<td><span class='pz-pass-value'>" + bestProbability + "%</span></td>" +
        "<td><span class='pz-event-best-line'>" + escapeHtml(bestLine) + "</span></td>" +
        "<td>" + (event.recommendations || []).length + "</td>" +
      "</tr>";
    });

    tableHtml += "</tbody></table></div>";

    var cardsHtml = "<div class='pz-events-cards'>";
    this.events.forEach(function (event) {
      var bestRec = (event.recommendations && event.recommendations[0]) || null;
      var bestProbability = bestRec ? formatProbability(bestRec.probability) : 0;
      var bestLine = bestRec ? bestRec.line + " @ " + formatCoef(bestRec.coefficient) : "Нет подходящих";

      cardsHtml += "<div class='pz-event-card'>" +
        "<div class='pz-event-card-head'>" +
          "<div class='pz-event-card-title'>" + escapeHtml(event.home) + " vs " + escapeHtml(event.away) + "</div>" +
          "<div class='pz-pass-value'>" + bestProbability + "%</div>" +
        "</div>" +
        "<div class='pz-event-card-meta'>" + escapeHtml(event.league) + " • " + asSport(event.sport) + " • " + escapeHtml(event.time || "LIVE") + "</div>" +
        "<div class='pz-event-card-meta'>Лучшая ставка: <span class='pz-event-best-line'>" + escapeHtml(bestLine) + "</span></div>" +
      "</div>";
    });
    cardsHtml += "</div>";

    this.allEventsList.innerHTML = tableHtml + cardsHtml;
  };

  var root = document.getElementById("prizolov-sport-widget");
  if (!root) return;

  var widget = new PrizolovWidget(root);
  widget.init();
})();
</script>
