# ============================================
# Prizolov Sports AI - Amvera Cloud Config
# Version: 4.02 (Syntax & Build Pipeline Fix)
# Author: Dm.Andreyanov
# Target: Production deployment at cloud.amvera.ru
# ============================================

meta:
  environment: python
  toolchain:
    name: pip
    version: "3.10"

build:
  # Корректный параметр указания файла зависимостей
  requirementsPath: requirements.txt
  # Запуск сборки proto-интерфейсов через валидную директиву Amvera
  additionalCommands:
    - python scripts/compile_proto.py

run:
  # Точка входа и аргументы запуска ИИ-модуля
  command: python main.py --sport football --match_id live_mcl_football_01 --agent_host localhost:50051
  # Исправленный синтаксис монтирования постоянного хранилища /data для кэша
  persistenceMount: /data
