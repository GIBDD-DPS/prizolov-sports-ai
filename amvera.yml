meta:
  environment: python
  toolchain:
    name: pip
    version: 3.10

build:
  requirements: requirements.txt

run:
  # 👍 ИСПРАВЛЕНО: Запуск переведен на корневой модуль main:app с явным указанием путей PYTHONPATH
  command: "PYTHONPATH=. uvicorn main:app --host 0.0.0.0 --port $PORT --loop asyncio --workers 1"
