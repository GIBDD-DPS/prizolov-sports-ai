meta:
  environment: python
  toolchain:
    name: pip
    version: "3.10"
build:
  requirementsPath: requirements.txt
  useCache: true
run:
  persistenceMount: /data
  containerPort: 8080
  servicePort: 8080
  run:
  command: uvicorn server:app --host 0.0.0.0 --port 8000 --app-dir api
