meta:
  environment: "python"
  toolchain: "pip"

build:
  requirements: "requirements.txt"

run:
  persistence:
    /data: "persistent-volume"
  containerPort: "8080"
  servicePort: "8080"
  command: "python main.py --sport football --match_id prod_match_001 --agent_host localhost:50051 --dashboard_port 8080"
