meta:
  environment: python
  toolchain:
    name: pip
    version: 3.10

run:
  # 👍 ИСПРАВЛЕНО: Рабочая директория uvicorn установлена внутрь папки app, 
  # что делает вложенную папку core видимой для Python без ошибок импорта.
  command: "uvicorn app.main:app --host 0.0.0.0 --port 8080 --loop asyncio --workers 1"
