meta:
  environment: python
  toolchain:
    name: pip
    version: "3.10"

build:
  requirementsPath: requirements.txt
  useCache: true
  # Добавляем шаг автоматической компиляции .proto контрактов в gRPC Python-классы
  additionalCommands:
    - python scripts/compile_proto.py

run:
  scriptName: null
  command: python main.py --sport football --match_id live_mcl_football_01 --agent_host localhost:50051
  persistenceMount: /data
  containerPort: "80"
  servicePort: "80"
