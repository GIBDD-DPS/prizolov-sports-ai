syntax = "proto3";

package prizolov.sports.ai;

// ============================================
// Prizolov Sports AI - Agent OS Interface Protocol
// Version: 3.01 (Initial Architecture Release)
// Author: Dm.Andreyanov
// Organization: Prizolov Market / Prizolov Lab
// Target: Production deployment at prizolov.ru
// ============================================

service SportsAnalyticService {
    // Стриминг Live-аналитики и широкой линии в Agent OS в реальном времени
    rpc StreamMatchAnalytics(stream MatchDataPackage) returns (AgentOSStatus);
}

enum SportType {
    SPORT_UNSPECIFIED = 0;
    SPORT_FOOTBALL = 1;
    SPORT_HOCKEY = 2;
    SPORT_BASKETBALL = 3;
}

message Coordinate2D {
    float x = 1;
    float y = 2;
}

message BallState {
    Coordinate2D position = 1;
    Coordinate2D velocity_vector = 2; // Вектор скорости для расчета траекторий (мяч/шайба)
    int32 last_touch_player_id = 3;    // ID игрока, коснувшегося последним
}

message AdvancedMetrics {
    float team_a_possession_pct = 1;  // Владение мячом/шайбой Команды А (%)
    float team_b_possession_pct = 2;  // Владение мячом/шайбой Команды Б (%)
    float expected_goals_xg_a = 3;    // Метрика xG для Команды А
    float expected_goals_xg_b = 4;    // Метрика xG для Команды Б
    int32 dangerous_attacks_a = 5;    // Опасные атаки Команды А
    int32 dangerous_attacks_b = 6;    // Опасные атаки Команды Б
}

message MarketOutcome {
    string market_name = 1;           // Название рынка (например, "Total Over 2.5", "Handicap 1 (-1.5)")
    float odds = 2;                   // Динамический коэффициент ИИ
    bool is_suspended = 3;            // Блокировка приема ставок (например, при пенальти или видеопросмотре)
}

message BroadLine {
    repeated MarketOutcome main_outcomes = 1; // П1, Х, П2
    repeated MarketOutcome totals = 2;        // Линейка тоталов
    repeated MarketOutcome handicaps = 3;     // Линейка фор
    repeated MarketOutcome active_specials = 4; // Угловые, карточки, удаления, броски
}

message MatchDataPackage {
    string match_id = 1;              // Уникальный ID матча в системе prizolov.ru
    SportType sport = 2;              // Вид спорта
    string game_time = 3;             // Текущее время матча (например, "74:12")
    uint64 timestamp_ms = 4;          // Таймштамп генерации пакета на сервере ИИ (для контроля пинга)
    
    BallState ball_state = 5;         // Состояние игрового снаряда
    AdvancedMetrics metrics = 6;      // Продвинутая ИИ-статистика
    BroadLine line_data = 7;          // Сгенерированная широкая линия
}

message AgentOSStatus {
    bool is_success = 1;              // Статус успешного приема пакета ядром Agent OS
    string error_message = 2;         // Описание ошибки, если прием заблокирован
    uint64 processed_timestamp_ms = 3; // Время обработки пакета Агентом
}
